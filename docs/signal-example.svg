<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Bullish Crab signal geometry</title>
  <desc id="description">A bullish five-point Crab with X, A, B, C, D pivots, harmonic ratio guides, target, stop, and entry after D confirmation.</desc>
  <rect width="1000" height="520" fill="#0f172a"/>
  <g stroke="#334155" stroke-width="1">
    <path d="M60 80H940M60 160H940M60 240H940M60 320H940M60 400H940"/>
    <path d="M100 50V450M280 50V450M460 50V450M640 50V450M820 50V450"/>
  </g>
  <path d="M120 310L300 100L480 205L660 120L820 390" fill="none" stroke="#22c55e" stroke-width="6" stroke-linejoin="round"/>
  <path d="M120 310L820 390" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8"/>
  <g fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5 7">
    <path d="M120 310L480 205"/>
    <path d="M300 100L660 120"/>
    <path d="M480 205L820 390"/>
  </g>
  <g fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="120" cy="310" r="8" fill="#22c55e"/><text x="120" y="345">X</text>
    <circle cx="300" cy="100" r="8" fill="#22c55e"/><text x="300" y="82">A</text>
    <circle cx="480" cy="205" r="8" fill="#22c55e"/><text x="480" y="240">B</text>
    <circle cx="660" cy="120" r="8" fill="#22c55e"/><text x="660" y="102">C</text>
    <circle cx="820" cy="390" r="8" fill="#22c55e"/><text x="820" y="425">D</text>
  </g>
  <g fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="18">
    <text x="270" y="230">XB 0.38–0.61</text>
    <text x="450" y="90">AC 0.38–0.88</text>
    <text x="650" y="275">BD 2.24–4.23</text>
    <text x="395" y="370" fill="#7dd3fc">XD 1.618</text>
  </g>
  <path d="M820 390L900 390" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M820 235L900 235" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M850 360V270" stroke="#f8fafc" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f8fafc"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui" font-size="18" font-weight="600">
    <text x="905" y="240" fill="#22c55e">target</text>
    <text x="905" y="395" fill="#ef4444">stop</text>
    <text x="868" y="330" fill="#f8fafc">LONG</text>
  </g>
</svg>
